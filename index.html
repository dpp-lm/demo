<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Model of Diverse Sampling from Language Models</title>
<meta name="description" content="Sample a pool of language-model completions, embed them, and pick a diverse subset with a K-DPP (arXiv:2611.25003). Runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="css/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm"
} }
</script>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand">
    <div>
      <h1>A Model of Diverse Sampling from Language Models</h1>
    </div>
  </div>
  <nav class="links">
    <span class="chip-quiet">Runs in your browser</span>
    <a href="https://arxiv.org/abs/2611.25003" target="_blank" rel="noopener">Paper ↗</a>
    <a href="https://github.com/timvieira/dpp-lm-demo" target="_blank" rel="noopener">Code ↗</a>
  </nav>
</header>

<main class="app">
  <aside class="controls" aria-label="Controls">
    <section class="step step-1">
      <div class="composer">
        <textarea id="prompt" rows="2" spellcheck="false" aria-label="Prompt" placeholder="Ask for something with many good answers"></textarea>
        <div class="comp-row">
          <details class="chipmenu" id="adv">
            <summary class="chip" aria-label="Sampling settings"><span id="adv-sum"></span></summary>
            <div class="menu">
              <label class="field"><span class="lab">Samples N</span><input id="live-N" type="number" min="10" max="200" step="10" value="30" inputmode="numeric"></label>
              <label class="field"><span class="lab">Temp. T′ <button type="button" class="xbtn" data-x="Tprime" aria-label="What is T′?">?</button></span><input id="live-Tp" type="number" min="0.2" max="2" step="0.1" value="1.0" inputmode="decimal"></label>
              <label class="field"><span class="lab">Max tokens</span><input id="live-max" type="number" min="8" max="256" step="8" value="64" inputmode="numeric"></label>
            </div>
          </details>
          <select id="examples" class="chip" aria-label="Example prompts"><option value="">Examples</option></select>
          <span class="grow"></span>
          <button id="live-stop" class="sendbtn stop" aria-label="Stop" title="Stop" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
          <button id="live-go" class="sendbtn" aria-label="Generate completions" title="Generate (Enter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
        </div>
      </div>
      <div class="progress" id="progress" hidden><div class="bar"><span id="progress-fill"></span></div><p id="progress-last" class="last"></p></div>
      <p id="live-status" class="status" aria-live="polite">Runs on your device; the first run downloads ~0.5&nbsp;GB.</p>
    </section>

    <section class="step step-2">
      <h2>Pick a subset</h2>
      <div class="mode-row">
        <div class="seg" role="radiogroup" aria-label="Selection rule">
          <label><input type="radio" name="mode" value="map" checked><span>Most likely</span></label>
          <label><input type="radio" name="mode" value="sample"><span>Sample</span></label>
        </div>
        <button type="button" class="xbtn" data-x="subset" aria-label="How is the subset chosen?">?</button>
      </div>
      <div class="field tfield">
        <div class="lab row"><span><label for="T-slider">Temperature T</label> <button type="button" class="xbtn" data-x="T" aria-label="What does T do?">?</button></span><output id="T-out" class="val">1.00</output></div>
        <div class="trow"><span>quality</span><input id="T-slider" type="range" min="0" max="1000" step="1" value="500"><span>diversity</span></div>
      </div>
      <div class="row-between">
        <div class="field">
          <span class="lab" id="K-lab">Subset size K</span>
          <div class="stepper" role="group" aria-labelledby="K-lab">
            <button class="btn icon" id="K-minus" aria-label="Decrease K">−</button>
            <input id="K" type="number" min="1" max="20" value="3" aria-labelledby="K-lab">
            <button class="btn icon" id="K-plus" aria-label="Increase K">+</button>
          </div>
        </div>
        <button id="resample" class="btn">Resample</button>
      </div>
    </section>
  </aside>

  <section class="stage" aria-label="Embeddings">
    <div class="stage-bar">
      <span id="stage-note" class="note"></span>
      <details class="viewmenu" id="viewmenu">
        <summary>View</summary>
        <div class="menu">
          <label class="toggle"><input type="checkbox" id="label-toggle" checked><span>Label selected points</span></label>
          <label class="toggle"><input type="checkbox" id="scale-toggle" checked><span>Scale points by quality</span> <button type="button" class="xbtn" data-x="scale" aria-label="What does scaling do?">?</button></label>
        </div>
      </details>
    </div>
    <div class="plot-wrap">
      <div class="plot-box">
        <div id="plot" class="plot" aria-label="Projection of the completions' embeddings"></div>
        <div id="labels" class="labels" aria-hidden="true"></div>
      </div>
      <div id="eigbars" class="eigbars"></div>
      <div id="inspect" class="inspect" aria-live="polite" hidden></div>
    </div>
    <div class="stage-foot">
      <div class="legend">
        <span class="lg"><span class="sw ramp"></span>more likely</span>
        <span class="lg"><span class="sw sel"></span>selected</span>
        <span id="vol-hint" class="lg"></span>
      </div>
      <div id="readout" class="readout"></div>
    </div>
  </section>
</main>

<section class="subset">
  <div class="subset-head">
    <h2>Selected subset</h2>
    <span id="subset-meta" class="note"></span>
  </div>
  <ol id="selected" class="cards" aria-label="Selected subset"></ol>
</section>

<details class="pool-table">
  <summary>All completions</summary>
  <div id="pool-table"></div>
</details>

</div>
<div id="tooltip" class="tooltip" hidden></div>
<div id="xpop" class="xpop" role="dialog" aria-modal="false" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
